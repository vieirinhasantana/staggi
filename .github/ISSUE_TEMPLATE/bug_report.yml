name: Bug Report
description: Create a report to help us fix a bug in Staggi
title: "[BUG]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting an issue! Please provide detailed information so we can reproduce and fix it quickly.
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: Describe what happened...
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to Reproduce
      description: Provide step-by-step instructions to reproduce the issue.
      placeholder: |
        1. Open Spotlight Bar via shortcut
        2. Type query '...'
        3. See error
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS (Apple Silicon - M1/M2/M3/M4)
        - macOS (Intel)
        - Windows 11 / 10
        - Linux (Ubuntu / Debian / Fedora / Arch)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Staggi Version
      placeholder: e.g. v0.1.0 or main branch
    validations:
      required: true
